[env:esp32d-servo-bridge]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -D SERVO_UART_BAUD=9600
    -D SERVO_UART_RX=16
    -D SERVO_UART_TX=17
    -D SERVO_OUTPUT_ENABLE=0
    -D PAN_SERVO_PIN=25
    -D TILT_SERVO_PIN=26
    -D PAN_HOME_DEG=90
    -D TILT_HOME_DEG=90
    -D PAN_MIN_DEG=20
    -D PAN_MAX_DEG=160
    -D TILT_MIN_DEG=35
    -D TILT_MAX_DEG=145

; ESP32Servo is vendored in lib/ESP32Servo so this project can build even when
; the PlatformIO library registry is unreachable.
