[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
upload_port = COM13
upload_speed = 115200
monitor_port = COM13
monitor_speed = 115200

build_flags = 
    -I .
    -include User_Setup.h
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; Keeps Serial alive for debugging
    -D EYE_SYNC_CHANNEL=0 ; 0 = slave hops channels until it hears the brain

lib_deps = bodmer/TFT_eSPI@^2.4.31

[env:esp32-s3-supermini]
build_flags =
    ${env.build_flags}
    -D EYE_SYNC_MODE=0 ; 0 standalone, 1 ESP-NOW master, 2 ESP-NOW slave
    -D EYE_SYNC_SIDE=0 ; 0 left-style eyelid render, 1 right-style eyelid render

[env:left_eye_master]
build_flags =
    ${env.build_flags}
    -D EYE_SYNC_MODE=1
    -D EYE_SYNC_SIDE=0

[env:left_eye_slave]
build_flags =
    ${env.build_flags}
    -D EYE_SYNC_MODE=2
    -D EYE_SYNC_SIDE=0

[env:right_eye_slave]
build_flags =
    ${env.build_flags}
    -D EYE_SYNC_MODE=2
    -D EYE_SYNC_SIDE=1
